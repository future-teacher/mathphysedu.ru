{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    
    <!-- Yandex SmartCaptcha -->
    <script src="https://smartcaptcha.yandexcloud.net/captcha.js?render=onload&onload=onSmartCaptchaLoad" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 16px;
            transition: color 0.2s ease;
            align-self: flex-start;
        }

        .back-link:hover {
            color: white;
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(45deg, skyblue, darkblue);
            padding: 30px;
            width: 450px;
            border-radius: 20px;
            transition: background 0.3s ease;
        }

        .form:hover {
            background: linear-gradient(45deg, darkblue, skyblue);
        }

        .form input::placeholder {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        .form button {
            align-self: flex-end;
        }

        .flex-column > label {
            color: white;
            font-weight: 600;
        }

        .inputForm {
            border: 1.5px solid #ecedec;
            border-radius: 10em;
            height: 50px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            transition: 0.2s ease-in-out;
            background-color: white;
        }

        .input {
            margin-left: 10px;
            border-radius: 10rem;
            border: none;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .input:focus {
            outline: none;
        }

        .inputForm:focus-within {
            border: 1.5px solid orange;
        }

        .button-submit {
            position: relative;
            display: inline-block;
            padding: 15px 30px;
            text-align: center;
            letter-spacing: 1px;
            text-decoration: none;
            background: transparent;
            transition: ease-out 0.5s;
            border: 2px solid;
            border-radius: 10em;
            box-shadow: inset 0 0 0 0 blue;
            margin: 20px 0 10px 0;
            color: white;
            font-size: 15px;
            font-weight: 500;
            height: 50px;
            width: 100%;
            cursor: pointer;
        }

        .button-submit:hover {
            color: white;
            box-shadow: inset 0 -100px 0 0 royalblue;
        }

        .button-submit:active {
            transform: scale(0.9);
        }
        
        .button-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .p {
            text-align: center;
            color: white;
            font-size: 14px;
            margin: 5px 0;
        }

        /* Alert message styling for Django form errors */
        .form .alert {
            background-color: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            color: white;
            padding: 10px 15px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 5px;
        }

        /* Hide the default Django help text and other extras */
        .form .helptext {
            display: none;
        }

        /* Error list styling */
        .form .errorlist {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
        }

        /* ===== Yandex SmartCaptcha Styles ===== */
        .captcha-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 5px;
        }
        
        .captcha-container .SmartCaptcha-Overlay {
            min-height: 80px;
        }
        
        .captcha-error {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 5px;
            padding: 8px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        /* Responsive */
        @media (max-width: 500px) {
            .form {
                width: 100%;
                padding: 20px;
            }
        }

        /* Mobile: уменьшаем капчу чтобы не вылезала за границы формы */
        @media (max-width: 480px) {
            .captcha-container {
                overflow: hidden;
                padding: 0;
                margin: 5px 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .captcha-container > div {
                transform: scale(0.78);
                transform-origin: center center;
            }
        }

        @media (max-width: 380px) {
            .captcha-container > div {
                transform: scale(0.68);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <form class="form" method="post" id="loginForm">
            <a href="/" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9.195 18.44c1.25.713 2.805-.19 2.805-1.629v-2.34l6.945 3.968c1.25.714 2.805-.188 2.805-1.628V7.172c0-1.44-1.555-2.342-2.805-1.628L12 9.5v-2.34c0-1.44-1.555-2.342-2.805-1.628l-7.108 4.062c-1.26.72-1.26 2.536 0 3.256l7.108 4.061Z"/>
                </svg>
                На главную
            </a>
            {% csrf_token %}

            {% if form.errors %}
            <div class="alert">
                Неверное имя пользователя или пароль
            </div>
            {% endif %}
            
            {% if captcha_error %}
            <div class="captcha-error">
                ⚠️ Пожалуйста, подтвердите, что вы не робот
            </div>
            {% endif %}

            <div class="flex-column">
                <label>Имя пользователя</label>
            </div>
            <div class="inputForm">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    viewBox="0 0 32 32"
                    height="20"
                >
                    <g data-name="Layer 3" id="Layer_3">
                        <path
                            d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"
                        ></path>
                    </g>
                </svg>
                <input
                    placeholder="Введите имя пользователя"
                    class="input"
                    type="text"
                    name="username"
                    id="id_username"
                    required
                    autofocus
                />
            </div>

            <div class="flex-column">
                <label>Пароль</label>
            </div>
            <div class="inputForm">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    viewBox="-64 0 512 512"
                    height="20"
                >
                    <path
                        d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"
                    ></path>
                    <path
                        d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"
                    ></path>
                </svg>
                <input
                    placeholder="Введите пароль"
                    class="input"
                    type="password"
                    name="password"
                    id="id_password"
                    required
                />
            </div>

            <!-- ===== YANDEX SMARTCAPTCHA ===== -->
            <div class="captcha-container" id="captcha-container"></div>
            <input type="hidden" name="smart-token" id="smart-token">
            <!-- ================================= -->

            <button class="button-submit" type="submit" id="submitBtn" disabled>
                Войти
            </button>

            <p class="p">Если забыли пароль, обратитесь к администратору</p>
        </form>
    </div>

    <!-- ===== YANDEX SMARTCAPTCHA SCRIPT ===== -->
    <script>
        let smartCaptchaWidgetId = null;

        function onSmartCaptchaLoad() {
            const container = document.getElementById('captcha-container');
            const tokenInput = document.getElementById('smart-token');
            const submitBtn = document.getElementById('submitBtn');
            
            console.log('🔍 Инициализация капчи на странице входа...');
            
            if (!container) {
                console.error('❌ Контейнер капчи не найден!');
                return;
            }
            
            if (!window.smartCaptcha) {
                console.error('❌ SmartCaptcha не загружен!');
                container.innerHTML = '<p style="color:red;font-size:13px;">⚠️ Ошибка загрузки капчи</p>';
                return;
            }
            
            const siteKey = '{{ captcha_site_key }}';
            console.log('SiteKey:', siteKey);
            
            if (!siteKey || siteKey.includes('placeholder')) {
                console.warn('⚠️ Используется placeholder-ключ!');
                container.innerHTML = '<p style="color:orange;font-size:13px;">⚠️ Капча в режиме разработки</p>';
                if (submitBtn) submitBtn.disabled = false;
                return;
            }
            
            try {
                smartCaptchaWidgetId = window.smartCaptcha.render(container, {
                    sitekey: siteKey,
                    callback: function(token) {
                        if (tokenInput) {
                            tokenInput.value = token;
                            console.log('✅ Токен получен!');
                        }
                        if (submitBtn) {
                            submitBtn.disabled = false;
                        }
                        // Убираем сообщение об ошибке капчи
                        const captchaError = document.querySelector('.captcha-error');
                        if (captchaError) {
                            captchaError.style.display = 'none';
                        }
                    },
                    onError: function(error) {
                        console.error('❌ Ошибка капчи:', error);
                        if (submitBtn) {
                            submitBtn.disabled = true;
                        }
                        if (tokenInput) {
                            tokenInput.value = '';
                        }
                        container.innerHTML = '<p style="color:red;font-size:13px;">⚠️ Ошибка капчи. Обновите страницу.</p>';
                    },
                    onChallenge: function() {
                        console.log('🔄 Задание капчи начато');
                    },
                    onSuccess: function() {
                        console.log('✅ Капча успешно решена');
                    }
                });
                console.log('✅ Виджет капчи создан, ID:', smartCaptchaWidgetId);
            } catch (error) {
                console.error('❌ Ошибка создания виджета:', error);
                container.innerHTML = '<p style="color:red;font-size:13px;">⚠️ Ошибка загрузки капчи</p>';
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    const smartToken = document.getElementById('smart-token');
                    if (!smartToken || !smartToken.value) {
                        e.preventDefault();
                        alert('Пожалуйста, пройдите проверку "Я не робот".');
                        return false;
                    }
                    console.log('✅ Форма входа отправляется с токеном');
                });
            }

            // Если есть ошибка капчи — показываем
            if (document.querySelector('.captcha-error')) {
                console.log('⚠️ Показана ошибка капчи');
            }
        });
    </script>
</body>
</html>
